<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HOTEL JOFA — Admin Dashboard (Demo)</title>
  <meta name="description" content="Hotel Jofa demonstration admin dashboard." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230b1f3a'/%3E%3Ctext x='32' y='42' font-size='26' text-anchor='middle' fill='%23d4af37' font-family='serif' font-weight='700'%3EHJ%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <!-- LOGIN -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="logo" style="justify-content:center;margin-bottom:12px;">
        <span class="logo-mark">HJ</span>
        <span class="logo-text">HOTEL JOFA</span>
      </div>
      <h1 data-i18n="admin.login">Hotel Jofa Admin Panel</h1>
      <form id="loginForm" novalidate>
        <div class="form-field"><label data-i18n="admin.username">Username</label><input type="text" id="loginUser" required /></div>
        <div class="form-field"><label data-i18n="admin.password">Password</label><input type="password" id="loginPass" required /></div>
        <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;" data-i18n="admin.signin">Sign In</button>
        <p class="form-error" id="loginError" role="alert"></p>
      </form>
      <p style="font-size:12px;color:var(--text-muted);margin-top:12px;">Credentials: admin / JofaDemo2026!</p>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div class="dash" id="dash" style="display:none;">
    <aside class="sidebar" id="sidebar">
      <div class="side-brand">
        <span class="logo-mark">HJ</span>
        <span class="logo-text" style="font-size:16px;">HOTEL JOFA</span>
      </div>
      <nav class="side-nav" id="sideNav">
        <button data-view="overview" class="active">Overview</button>
        <button data-view="bookings">Bookings</button>
        <button data-view="rooms">Room Management</button>
        <button data-view="facilities">Facilities</button>
        <button data-view="menu">Restaurant Menu</button>
        <button data-view="events">Event Inquiries</button>
        <button data-view="contacts">Contact Inquiries</button>
        <button data-view="gallery">Gallery Management</button>
        <button data-view="news">News &amp; Updates</button>
        <button data-view="testimonials">Testimonials</button>
        <button data-view="settings">Website Settings</button>
        <button data-view="theme">Theme Settings</button>
        <button data-view="language">Language Settings</button>
      </nav>
      <div class="side-foot">
        <a href="../index.html" target="_blank" class="btn btn-outline btn-sm" style="width:100%;margin-bottom:8px;">View Site</a>
        <button class="btn btn-primary btn-sm" id="logoutBtn" style="width:100%;" data-i18n="admin.logout">Logout</button>
      </div>
    </aside>

    <div class="dash-main">
      <header class="dash-top">
        <button class="hamburger" id="sideToggle" aria-label="Toggle sidebar">☰</button>
        <h2 id="viewTitle">Overview</h2>
        <div class="dash-top-actions">
          <div class="lang-switch" role="group">
            <button class="lang-btn" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="sw">SW</button>
          </div>
          <button class="theme-toggle" id="dashThemeToggle" aria-label="Toggle theme">
            <i data-lucide="sun" class="icon-sun"></i>
            <i data-lucide="moon" class="icon-moon"></i>
          </button>
        </div>
      </header>

      <div class="dash-content" id="dashContent"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
